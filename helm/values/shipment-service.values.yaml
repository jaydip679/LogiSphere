# ==============================================================================
# LogiSphere — Production Values: Shipment Service
# Target: Amazon EKS (ap-south-1 Mumbai)
# ==============================================================================

replicaCount: 1

image:
  # ECR Repository URL from Terraform output 'ecr_repository_urls["shipment-service"]'
  repository: "<AWS_ACCOUNT_ID>.dkr.ecr.ap-south-1.amazonaws.com/logisphere-shipment-service"
  pullPolicy: IfNotPresent
  tag: "1.0.0"

service:
  type: ClusterIP
  port: 5002
  targetPort: 5002

# IRSA IAM Role for AWS SQS publisher operations
serviceAccount:
  create: true
  annotations:
    # Role ARN from Terraform output 'microservices_sqs_role_arn'
    eks.amazonaws.com/role-arn: "arn:aws:iam::<AWS_ACCOUNT_ID>:role/logisphere-production-microservices-sqs-role"

env:
  - name: NODE_ENV
    value: "production"
  - name: PORT_SHIPMENT
    value: "5002"
  - name: HOST_SHIPMENT
    value: "0.0.0.0"
  - name: AWS_REGION
    value: "ap-south-1"
  - name: QUEUE_PREFIX
    value: "logisphere-eks-"
  - name: SQS_ENV_PREFIX
    value: "logisphere-eks-"
  - name: TARGET_DB
    value: "neon"
  - name: USE_NEON
    value: "true"
  - name: AUTH_SERVICE_URL
    value: "http://auth-service.logisphere.svc.cluster.local:5001"
  - name: FLEET_SERVICE_URL
    value: "http://fleet-dispatch-service.logisphere.svc.cluster.local:5003"
  - name: TRACKING_SERVICE_URL
    value: "http://tracking-service.logisphere.svc.cluster.local:5004"
  - name: NOTIFICATION_SERVICE_URL
    value: "http://notification-service.logisphere.svc.cluster.local:5005"

# Injects pooled DATABASE_URL (for shipment schema), INTERNAL_SERVICE_KEY, and JWT_PUBLIC_KEY
# NO JWT private key; NO direct unpooled URL
envFrom:
  - secretRef:
      name: shipment-service-secrets

ingress:
  enabled: false

autoscaling:
  enabled: false
