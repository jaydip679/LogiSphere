# ==============================================================================
# LogiSphere — Platform Values: AWS Load Balancer Controller
# Chart: eks/aws-load-balancer-controller (https://aws.github.io/eks-charts)
# Pinned Chart Version: 1.11.0 (Application Version: v2.11.0)
# Target: Amazon EKS (ap-south-1 Mumbai)
# ==============================================================================

# Target EKS cluster name matching Terraform output 'cluster_name'
clusterName: "logisphere-eks-cluster"

# Target AWS Region
region: "ap-south-1"

# The VPC ID is injected dynamically from Terraform output 'vpc_id':
#   --set vpcId=$(terraform -chdir=terraform output -raw vpc_id)
vpcId: "<VPC_ID>"

# Dedicated ServiceAccount annotated with the ALB Controller IRSA IAM Role
serviceAccount:
  create: true
  name: "aws-load-balancer-controller"
  annotations:
    # Role ARN injected dynamically from Terraform output 'aws_load_balancer_controller_role_arn':
    #   --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=$(terraform -chdir=terraform output -raw aws_load_balancer_controller_role_arn)
    eks.amazonaws.com/role-arn: "<ALB_CONTROLLER_ROLE_ARN>"

# Single replica for demonstration on EKS worker nodes (configured default: 2x t3.small Spot instances)
replicaCount: 1

# Resource allocations calibrated for worker node capacity
resources:
  requests:
    cpu: 50m
    memory: 100Mi
  limits:
    cpu: 200m
    memory: 200Mi

# Default IngressClass parameters
ingressClass: "alb"
createIngressClassResource: true

# Security extensions disabled for demonstration
enableShield: false
enableWaf: false
enableWafv2: false
